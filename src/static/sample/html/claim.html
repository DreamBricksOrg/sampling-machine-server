<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Machine - Retire sua Amostra</title>
    <link rel="stylesheet" href="/templates/sample/css/sample-root.css">
    <link rel="stylesheet" href="/templates/sample/css/claim.css">
</head>

<body>
    {% include "header.html" %}
    <div class="container">

        <div class="text-content">
            <p>RETIRE SUA</p>
            <p>AMOSTRA</p>
            <p>NO TOTEM AO LADO</p>
        </div>

    </div>

    <script>
        async function completeSession() {
            const sessionId = localStorage.getItem('session_id');
            setStorage("obtainedPrize", true, 1);
            if (!sessionId) return;

            try {
                const result = await fetch(
                    `/api/sample/session/complete/${encodeURIComponent(sessionId)}`
                );
                const data = await result.json();
                console.log(data);
                if (!data.is_complete) {
                    setTimeout(() => {
                        completeSession();
                    }, 5000);
                }
                else {
                    const queryString = new URLSearchParams(window.location.search).toString();
                    window.location.href = queryString
                        ? `/api/sample/finish?${queryString}`
                        : '/api/sample/finish';
                }
            } catch (_) { }
        }
        function setStorage(key, value, timeInMinutes) {
            localStorage.setItem(key, JSON.stringify({
                value: value,
                expires: Date.now() + timeInMinutes * 60000
            }));
        }
        document.addEventListener('DOMContentLoaded', completeSession);
    </script>
</body>

</html>
